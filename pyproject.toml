[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vllm-nnrp-adapter"
version = "0.1.0"
description = "vLLM adapter for serving OpenAI-compatible NNRP API traffic"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "NagareWorks" }
]
keywords = ["nnrp", "vllm", "openai", "adapter", "inference", "streaming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "nnrp-py>=1.0.0rc4.post14,<1.0.0rc5",
  "packaging>=24.0",
]

[project.scripts]
vllm-nnrp-adapter = "vllm_nnrp_adapter.cli:main"

[project.optional-dependencies]
vllm = [
  "vllm>=0.18.0,<0.27",
]
dev = [
  "build>=1.2.2",
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/NagareWorks/vllm-nnrp-adapter"
Repository = "https://github.com/NagareWorks/vllm-nnrp-adapter"
Issues = "https://github.com/NagareWorks/vllm-nnrp-adapter/issues"
Documentation = "https://nagareworks.github.io/nnrp-doc/en/design/openai-compatible-profile"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_nnrp_adapter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
strict = true
packages = ["vllm_nnrp_adapter"]
