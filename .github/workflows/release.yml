name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release when running manually.
        required: true
        default: main
      create_tag:
        description: Create and push the resolved release tag before publishing.
        required: true
        type: boolean
        default: false
      publish_github_release:
        description: Publish or update the GitHub Release.
        required: true
        type: boolean
        default: false
      publish_to_pypi:
        description: Publish built distributions to PyPI.
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: release
    env:
      PYPI_PUBLISH_MODE: ${{ vars.PYPI_PUBLISH_MODE || 'disabled' }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          print(f"package_version={version}")
          print(f"tag_name=v{version}")
          print(f"release_name=vllm-nnrp-adapter v{version}")
          PY

      - name: Validate pushed tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="${{ steps.version.outputs.tag_name }}"
          actual_tag="${{ github.ref_name }}"
          if [ "$actual_tag" != "$expected_tag" ]; then
            echo "Release tag mismatch: expected $expected_tag but workflow was triggered by $actual_tag."
            exit 1
          fi

      - name: Validate manual release options
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.publish_github_release }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual GitHub Release publishing requires create_tag=true."
            exit 1
          fi
          if [ "${{ inputs.publish_to_pypi }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual PyPI publishing requires create_tag=true."
            exit 1
          fi

      - name: Create git tag
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          tag="${{ steps.version.outputs.tag_name }}"
          if [ -z "$(git tag --list "$tag")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] build twine

      - name: Verify release gates
        run: |
          ruff check .
          mypy
          python scripts/generate_vllm_compatibility_table.py --check
          pytest \
            --cov=src/vllm_nnrp_adapter \
            --cov-report=xml:artifacts/coverage/coverage.xml \
            --cov-fail-under=90 \
            -q
          vllm-nnrp-adapter run-benchmark \
            --output artifacts/openai-profile-benchmark.json \
            --backend mock \
            --iterations 200 \
            --warmup 20

      - name: Build distributions
        run: |
          python -m build
          python scripts/check_distribution_metadata.py dist
          python -m twine check dist/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: vllm-nnrp-adapter-${{ steps.version.outputs.package_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_github_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.release_name }}
          files: dist/*

      - name: Publish to PyPI with Trusted Publisher
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_to_pypi)) && env.PYPI_PUBLISH_MODE == 'trusted'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to PyPI with API token
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_to_pypi)) && env.PYPI_PUBLISH_MODE == 'token' && env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_API_TOKEN }}
