name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release when running manually.
        required: true
        default: main
      create_tag:
        description: Create and push the resolved release tag before publishing.
        required: true
        type: boolean
        default: false
      publish_github_release:
        description: Publish or update the GitHub Release.
        required: true
        type: boolean
        default: false
      publish_to_pypi:
        description: Publish built distributions to PyPI.
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: release
    env:
      PYPI_PUBLISH_MODE: ${{ vars.PYPI_PUBLISH_MODE || 'disabled' }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Checkout pinned conformance suite
        uses: actions/checkout@v5
        with:
          repository: NagareWorks/nnrp-conformance
          ref: 7ea6e30ab61a76efc9ce9cf2fe6aa93312edda81
          path: nnrp-conformance

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nnrp-conformance

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          print(f"package_version={version}")
          print(f"tag_name=v{version}")
          print(f"release_name=vllm-nnrp-adapter v{version}")
          PY

      - name: Validate manual release options
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.publish_github_release }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual GitHub Release publishing requires create_tag=true."
            exit 1
          fi
          if [ "${{ inputs.publish_to_pypi }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual PyPI publishing requires create_tag=true."
            exit 1
          fi

          if [ "${{ inputs.publish_to_pypi }}" = "true" ] && [ "$PYPI_PUBLISH_MODE" != "trusted" ] && [ "$PYPI_PUBLISH_MODE" != "token" ]; then
            echo "PyPI publishing requires PYPI_PUBLISH_MODE=trusted or token."
            exit 1
          fi

          if [ "${{ inputs.publish_to_pypi }}" = "true" ] && [ "$PYPI_PUBLISH_MODE" = "token" ] && [ -z "$PYPI_API_TOKEN" ]; then
            echo "Token-mode PyPI publishing requires PYPI_API_TOKEN."
            exit 1
          fi

      - name: Validate immutable release identity
        if: inputs.create_tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          python scripts/check_release_identity.py \
            --expected-ref origin/main \
            --tag "${{ steps.version.outputs.tag_name }}"

      - name: Validate Preview4 TODO closure
        if: inputs.create_tag
        run: python scripts/check_preview4_todo.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] build twine

      - name: Verify release gates
        run: |
          ruff check .
          mypy
          python scripts/generate_vllm_compatibility_table.py --check
          pytest \
            --cov=src/vllm_nnrp_adapter \
            --cov-report=xml:artifacts/coverage/coverage.xml \
            --cov-fail-under=90 \
            -q
          vllm-nnrp-adapter run-benchmark \
            --output artifacts/openai-profile-benchmark.json \
            --backend mock \
            --iterations 200 \
            --warmup 20
          python scripts/run_api_profile_conformance.py \
            --conformance-root nnrp-conformance \
            --artifact-directory artifacts/api-profile-conformance
          python scripts/run_wire_e2e.py \
            --conformance-root nnrp-conformance \
            --artifact-directory artifacts/wire-e2e

      - name: Build distributions
        run: |
          python -m build
          python scripts/check_distribution_metadata.py dist
          python -m twine check dist/*

      - name: Resolve PyPI publication identity
        id: pypi
        if: inputs.publish_to_pypi
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_pypi_identity.py \
            --dist dist \
            --package vllm-nnrp-adapter \
            --version "${{ steps.version.outputs.package_version }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: vllm-nnrp-adapter-${{ steps.version.outputs.package_version }}
          path: |
            dist/*
            artifacts/api-profile-conformance
            artifacts/wire-e2e
          if-no-files-found: error
          retention-days: 14

      - name: Create git tag
        if: inputs.create_tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          tag="${{ steps.version.outputs.tag_name }}"
          if [ -z "$(git tag --list "$tag")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
          else
            echo "Release tag $tag already points to the validated source commit; reusing it."
          fi

      - name: Publish to PyPI with Trusted Publisher
        if: inputs.create_tag && inputs.publish_to_pypi && steps.pypi.outputs.publish_required == 'true' && env.PYPI_PUBLISH_MODE == 'trusted'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to PyPI with API token
        if: inputs.create_tag && inputs.publish_to_pypi && steps.pypi.outputs.publish_required == 'true' && env.PYPI_PUBLISH_MODE == 'token' && env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_API_TOKEN }}

      - name: Verify public PyPI identity
        if: inputs.create_tag && inputs.publish_to_pypi
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if python scripts/check_pypi_identity.py \
              --dist dist \
              --package vllm-nnrp-adapter \
              --version "${{ steps.version.outputs.package_version }}" \
              --require-published; then
              exit 0
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Published distributions did not become available with matching hashes."
              exit 1
            fi
            sleep 15
          done

      - name: Publish GitHub release
        if: inputs.create_tag && inputs.publish_github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.release_name }}
          files: dist/*
