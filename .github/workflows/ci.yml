name: CI

on:
  push:
    branches:
      - develop
      - main
      - release/**
  pull_request:
  workflow_dispatch:

jobs:
  commit-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Enforce single-commit PR policy
        shell: bash
        run: |
          set -euo pipefail

          head_ref="${{ github.head_ref }}"
          base_ref="${{ github.base_ref }}"

          if [[ "$head_ref" == "develop" && "$base_ref" == "main" ]]; then
            echo "Develop-to-main integration PR detected; multi-commit history is allowed."
            exit 0
          fi

          if [[ "$head_ref" =~ ^release/ ]] || [[ "$base_ref" =~ ^release/ ]]; then
            echo "Release/version branch PR detected; multi-commit history is allowed when needed."
            exit 0
          fi

          commit_count='${{ github.event.pull_request.commits }}'
          if [ "$commit_count" -ne 1 ]; then
            echo "Normal PRs from feature/fix/docs/chore branches must contain exactly one commit before review. Current PR has $commit_count commits. Squash the history before requesting review."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] build

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Check generated compatibility table
        run: python scripts/generate_vllm_compatibility_table.py --check

      - name: Test with coverage
        run: |
          pytest \
            --cov=src/vllm_nnrp_adapter \
            --cov-report=xml:artifacts/coverage/coverage.xml \
            --cov-fail-under=90 \
            -q

      - name: Build package
        run: python -m build

      - name: Validate distribution metadata
        run: python scripts/check_distribution_metadata.py dist

  wire-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v5

      - name: Checkout pinned conformance suite
        uses: actions/checkout@v5
        with:
          repository: NagareWorks/nnrp-conformance
          ref: b1341d36184c4095fbf81937df505c8d275399fb
          path: nnrp-conformance

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nnrp-conformance

      - name: Install adapter and native providers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run independent OpenAI profile wire E2E
        run: |
          python scripts/run_wire_e2e.py \
            --conformance-root nnrp-conformance \
            --artifact-directory artifacts/wire-e2e

      - name: Upload wire evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openai-profile-wire-e2e
          path: artifacts/wire-e2e
          if-no-files-found: error

  api-profile-conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v5

      - name: Checkout pinned conformance suite
        uses: actions/checkout@v5
        with:
          repository: NagareWorks/nnrp-conformance
          ref: b1341d36184c4095fbf81937df505c8d275399fb
          path: nnrp-conformance

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nnrp-conformance

      - name: Install adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run suite-generated API profile plans
        run: |
          python scripts/run_api_profile_conformance.py \
            --conformance-root nnrp-conformance \
            --artifact-directory artifacts/api-profile-conformance

      - name: Upload API profile evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openai-api-profile-conformance
          path: artifacts/api-profile-conformance
          if-no-files-found: error

  required-checks:
    needs:
      - commit-policy
      - test
      - api-profile-conformance
      - wire-e2e
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enforce required CI path
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.commit-policy.result }}" != "success" ]; then
            echo "PR commit policy validation failed."
            exit 1
          fi

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Lint, type check, test, coverage, or package build validation failed."
            exit 1
          fi

          if [ "${{ needs.api-profile-conformance.result }}" != "success" ]; then
            echo "Suite-generated OpenAI API profile conformance failed."
            exit 1
          fi

          if [ "${{ needs.wire-e2e.result }}" != "success" ]; then
            echo "Independent OpenAI profile wire E2E failed."
            exit 1
          fi
